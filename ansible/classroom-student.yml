# Appendix B: set up a student workstation from the classroom kit. Needs no internet and no Red Hat account.
# Run on the student workstation, in the kit folder:
#
#   ansible-playbook guide/ansible/classroom-student.yml
#
# It checks the workstation and the kit, then creates the working folder ~/edgelab as "Prepare the workstation" does.

- name: Set up the workstation from the classroom kit
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files: vars.yml
  vars:
    kit: "{{ playbook_dir | dirname | dirname }}"
    home_dir: "{{ lookup('env', 'HOME') }}"
    work_dir: "{{ lab_dir }}"
  tasks:
    - name: Set up the workstation
      ansible.builtin.import_tasks: tasks/student-setup.yml
